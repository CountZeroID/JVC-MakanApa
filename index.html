  <body>
    <div id="root"></div>
    <script>
      // Prevent fetch polyfill override and protect against 'getter only' TypeError
      (function() {
        var nativeFetch = window.fetch;
        if (nativeFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return nativeFetch; },
              set: function() { console.warn('Ignored attempt to override window.fetch'); },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
